# Keep the root project explicit for pnpm 10, which is used by Cloudflare Builds.
packages:
  - "."

# pnpm 10+ reads the build-script allowlist from the workspace config.
onlyBuiltDependencies:
  - "@sentry/cli"
  - esbuild
  - sharp
  - workerd

# pnpm 11 replaces onlyBuiltDependencies with per-package build policies.
allowBuilds:
  '@sentry/cli': true
  esbuild: true
  sharp: true
  workerd: true
